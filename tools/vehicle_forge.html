<!doctype html>
<html><head><meta charset="utf-8"><title>Vehicle forge</title>
<style>body{margin:0;background:#ccc}canvas{display:block}</style></head>
<body>
<script>
/*
 * Générateur de sprites isométriques des véhicules Protection Civile
 * Projection identique au moteur ProtecBaseLive : sx = (X - Y)*k ; sy = (X + Y)*k/2 - Z*k*HZ
 * Chaque modèle est rendu dans 4 caps : se (+X, nez en bas à droite), sw (+Y), nw (-X), ne (-Y).
 */
const HZ = 1.05;
const K = 84; // px par mètre dans les sprites

const NAVY = '#1d3c8c', ORANGE = '#f7941d', YELLOW = '#facc15', RED = '#dc2626', GLASS = '#1e293b', DARK = '#111827';

// ---------- algèbre ----------
const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const norm = (a) => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; };
const VIEW = norm([1, 1, 1.25]); // vers la caméra

function makeCam(theta) {
  const c = Math.round(Math.cos(theta)), s = Math.round(Math.sin(theta));
  const toWorld = (p) => [p[0] * c - p[1] * s, p[0] * s + p[1] * c, p[2]];
  const proj = (p) => { const w = toWorld(p); return [(w[0] - w[1]) * K, (w[0] + w[1]) * K / 2 - w[2] * K * HZ]; };
  return { toWorld, proj };
}

// Une face plane : origine o, axes eu (droite du spectateur) et ev, normale sortante n (repère local)
function faceTransform(ctx, cam, o, eu, ev, ox, oy) {
  const p0 = cam.proj(o), pu = cam.proj([o[0] + eu[0], o[1] + eu[1], o[2] + eu[2]]), pv = cam.proj([o[0] + ev[0], o[1] + ev[1], o[2] + ev[2]]);
  ctx.setTransform(pu[0] - p0[0], pu[1] - p0[1], pv[0] - p0[0], pv[1] - p0[1], p0[0] + ox, p0[1] + oy);
}
function visible(cam, n) { return dot(cam.toWorld(n), VIEW) > 0.02; }
function shadeOf(cam, n) {
  const w = cam.toWorld(n);
  if (w[2] > 0.85) return 0.0;
  return Math.max(0, 0.16 * w[0] - 0.02 * w[1]) + 0.05 * (1 - Math.abs(w[2]));
}

// Texte dans le repère d'une face (v vers le haut)
function faceText(ctx, txt, u, v, size, color, align = 'center', weight = 900, maxW) {
  ctx.save();
  ctx.translate(u, v);
  ctx.scale(0.01, -0.01);
  ctx.font = `${weight} ${size * 100}px "Arial Black", Arial, sans-serif`;
  ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = 'middle';
  if (maxW) ctx.fillText(txt, 0, 0, maxW * 100); else ctx.fillText(txt, 0, 0);
  ctx.restore();
}
function rect(ctx, x, y, w, h, c) { ctx.fillStyle = c; ctx.fillRect(x, y, w, h); }
function chevrons(ctx, x0, y0, w, h, colA = RED, colB = YELLOW, step = 0.16) {
  ctx.save(); ctx.beginPath(); ctx.rect(x0, y0, w, h); ctx.clip();
  rect(ctx, x0, y0, w, h, colB);
  ctx.fillStyle = colA;
  for (let x = x0 - h; x < x0 + w + h; x += step * 2) {
    ctx.beginPath(); ctx.moveTo(x, y0); ctx.lineTo(x + step, y0); ctx.lineTo(x + step + h, y0 + h); ctx.lineTo(x + h, y0 + h); ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}
function logo(ctx, u, v, r) {
  ctx.fillStyle = ORANGE; ctx.beginPath(); ctx.arc(u, v, r, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(u, v, r * 0.78, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = NAVY; ctx.beginPath(); ctx.moveTo(u, v + r * 0.55); ctx.lineTo(u - r * 0.5, v - r * 0.32); ctx.lineTo(u + r * 0.5, v - r * 0.32); ctx.closePath(); ctx.fill();
}
function glass(ctx, pts, refl = true) {
  ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]); pts.slice(1).forEach(p => ctx.lineTo(p[0], p[1])); ctx.closePath();
  ctx.fillStyle = GLASS; ctx.fill();
  if (refl) {
    ctx.save(); ctx.clip();
    const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
    const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
    ctx.fillStyle = 'rgba(148,197,255,0.28)';
    ctx.beginPath(); ctx.moveTo(x0 + (x1 - x0) * 0.15, y0); ctx.lineTo(x0 + (x1 - x0) * 0.35, y0); ctx.lineTo(x0 + (x1 - x0) * 0.6, y1); ctx.lineTo(x0 + (x1 - x0) * 0.4, y1); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  ctx.strokeStyle = '#0b1220'; ctx.lineWidth = 0.03; ctx.stroke();
}

// ---------- Prisme extrudé : profil (x,z) CCW, largeur W ----------
// faces de profil taguées pour la décoration
function prism(profile, W, tags, yOff = 0) {
  return { profile, W, tags, yOff };
}

function drawPrism(ctx, cam, pr, deco, ox, oy, base = '#f8fafc') {
  const { profile, W } = pr;
  const faces = [];
  // flancs y = ±W/2
  [1, -1].forEach(side => {
    const n = [0, side, 0];
    if (!visible(cam, n)) return;
    // eu tel que eu × ev = n avec ev = +z  →  eu = [side, 0, 0] ?  [1,0,0]×[0,0,1] = [0,-1,0]
    // Repère écran "gaucher" (y vers le bas) : u = droite du spectateur quand eu × ev = -n
    const eu = [side, 0, 0];
    faces.push({ kind: 'side', side, n, o: [0, side * W / 2 + pr.yOff, 0], eu, ev: [0, 0, 1], poly: profile.map(([x, z]) => [side * x, z]) });
  });
  // faces de bord de profil
  for (let i = 0; i < profile.length; i++) {
    const a = profile[i], b = profile[(i + 1) % profile.length];
    const tag = pr.tags[i];
    if (!tag || tag === 'skip') continue;
    const ex = b[0] - a[0], ez = b[1] - a[1];
    const len = Math.hypot(ex, ez);
    const n = norm([ez, 0, -ex]);
    if (!visible(cam, n)) continue;
    // Les faces qui descendent (arrière, hayon) sont paramétrées de bas en haut pour garder textes et logos à l'endroit
    const down = ez < -1e-6;
    const ev = down ? [-ex / len, 0, -ez / len] : [ex / len, 0, ez / len];
    const fo = down ? b : a;
    let eu = [0, 1, 0];
    if (dot(cross(eu, ev), n) > 0) eu = [0, -1, 0];
    faces.push({ kind: tag, n, o: [fo[0], pr.yOff, fo[1]], eu, ev, len, poly: [[-W / 2, 0], [W / 2, 0], [W / 2, len], [-W / 2, len]] });
  }
  faces.forEach(f => {
    faceTransform(ctx, cam, f.o, f.eu, f.ev, ox, oy);
    ctx.beginPath(); ctx.moveTo(f.poly[0][0], f.poly[0][1]); f.poly.slice(1).forEach(p => ctx.lineTo(p[0], p[1])); ctx.closePath();
    ctx.fillStyle = base; ctx.fill();
    ctx.save(); ctx.clip();
    if (deco[f.kind]) deco[f.kind](ctx, f, f.kind === 'side' ? (x) => f.side * x : null);
    const sh = shadeOf(cam, f.n);
    if (sh > 0) { ctx.fillStyle = `rgba(15,23,50,${sh})`; ctx.fillRect(-20, -20, 40, 40); }
    ctx.restore();
    ctx.beginPath(); ctx.moveTo(f.poly[0][0], f.poly[0][1]); f.poly.slice(1).forEach(p => ctx.lineTo(p[0], p[1])); ctx.closePath();
    ctx.strokeStyle = 'rgba(30,41,59,0.75)'; ctx.lineWidth = 0.022; ctx.stroke();
  });
}

// Pavé simple (gyrophares, rétroviseurs, châssis)
function drawBox(ctx, cam, x0, x1, y0, y1, z0, z1, cols, ox, oy) {
  const P = [x0, x1, y0, y1, z0, z1];
  const faces = [
    { n: [0, 0, 1], o: [x0, y0, z1], eu: [1, 0, 0], ev: [0, 1, 0], w: x1 - x0, h: y1 - y0, c: cols.top },
    { n: [1, 0, 0], o: [x1, y0, z0], eu: [0, 1, 0], ev: [0, 0, 1], w: y1 - y0, h: z1 - z0, c: cols.side },
    { n: [-1, 0, 0], o: [x0, y1, z0], eu: [0, -1, 0], ev: [0, 0, 1], w: y1 - y0, h: z1 - z0, c: cols.side },
    { n: [0, 1, 0], o: [x1, y1, z0], eu: [-1, 0, 0], ev: [0, 0, 1], w: x1 - x0, h: z1 - z0, c: cols.side },
    { n: [0, -1, 0], o: [x0, y0, z0], eu: [1, 0, 0], ev: [0, 0, 1], w: x1 - x0, h: z1 - z0, c: cols.side }
  ];
  void P;
  faces.forEach(f => {
    if (!visible(cam, f.n)) return;
    faceTransform(ctx, cam, f.o, f.eu, f.ev, ox, oy);
    ctx.fillStyle = f.c; ctx.fillRect(0, 0, f.w, f.h);
    const sh = shadeOf(cam, f.n);
    if (sh > 0) { ctx.fillStyle = `rgba(15,23,50,${sh * 1.4})`; ctx.fillRect(0, 0, f.w, f.h); }
    ctx.strokeStyle = 'rgba(15,23,42,0.7)'; ctx.lineWidth = 0.015; ctx.strokeRect(0, 0, f.w, f.h);
  });
}

// Roue : disque dans le plan latéral
function drawWheel(ctx, cam, x, y, r, ox, oy, side, wide = 0.22) {
  // flanc extérieur + bande de roulement simplifiée
  const yIn = y - side * wide;
  [yIn, y].forEach((yy, i) => {
    faceTransform(ctx, cam, [x, yy, r], [1, 0, 0], [0, 0, 1], ox, oy);
    ctx.fillStyle = i === 0 ? '#0b0f17' : '#161b26';
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
    if (i === 1) {
      ctx.fillStyle = '#9ca3af'; ctx.beginPath(); ctx.arc(0, 0, r * 0.55, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#4b5563'; ctx.beginPath(); ctx.arc(0, 0, r * 0.22, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#6b7280'; ctx.lineWidth = 0.025;
      for (let k = 0; k < 5; k++) { const a = k / 5 * Math.PI * 2; ctx.beginPath(); ctx.moveTo(Math.cos(a) * r * 0.22, Math.sin(a) * r * 0.22); ctx.lineTo(Math.cos(a) * r * 0.52, Math.sin(a) * r * 0.52); ctx.stroke(); }
    }
  });
}

// ---------- Décors communs ----------
function sideLivery(ctx, f, X, M, opts) {
  // X(x) convertit x local -> u du flanc ; M = modèle
  const L = M.L, zb = M.zb;
  const u = (x) => X(x);
  const urect = (xa, xb, z0, z1, c) => { const a = u(xa), b = u(xb); rect(ctx, Math.min(a, b), z0, Math.abs(b - a), z1 - z0, c); };
  // bas de caisse sombre
  urect(-L / 2, L / 2, zb - 0.02, zb + 0.07, '#374151');
  // damier bleu/orange (battenburg)
  const sq = 0.17, z0 = opts.checkZ || 0.5;
  for (let x = -L / 2 + 0.05, i = 0; x < (opts.checkEnd ?? L / 2 - 0.25); x += sq, i++) {
    urect(x, x + sq, z0, z0 + sq, i % 2 ? NAVY : ORANGE);
    urect(x, x + sq, z0 + sq, z0 + 2 * sq, i % 2 ? ORANGE : NAVY);
  }
  // vague orange (arrière vers milieu)
  const sw0 = opts.swooshFrom ?? -L / 2, sw1 = opts.swooshTo ?? 0.3;
  const zs = z0 + 2 * sq;
  ctx.beginPath();
  ctx.moveTo(u(sw0), zs); ctx.lineTo(u(sw1 + 0.6), zs);
  ctx.quadraticCurveTo(u(sw1), zs + 0.1, u(sw0 + 0.4), (opts.swooshTop ?? 1.25));
  ctx.lineTo(u(sw0), (opts.swooshTop ?? 1.25));
  ctx.closePath();
  const g = ctx.createLinearGradient(u(sw0), 0, u(sw1 + 0.6), 0);
  g.addColorStop(0, ORANGE); g.addColorStop(0.75, 'rgba(247,148,29,0.65)'); g.addColorStop(1, 'rgba(247,148,29,0)');
  ctx.fillStyle = g; ctx.fill();
  // filet jaune haut
  if (opts.yellowZ) urect(-L / 2, opts.yellowEnd ?? L / 2 - 1.4, opts.yellowZ, opts.yellowZ + 0.045, YELLOW);
  // arches de roues
  M.axles.forEach(ax => { ctx.fillStyle = '#1f2937'; ctx.beginPath(); ctx.arc(u(ax), 0, M.r + 0.07, 0, Math.PI); ctx.fill(); });
}

function sideTexts(ctx, X, M, main, top, opts = {}) {
  const u = (x) => X(x);
  faceText(ctx, 'PROTECTION CIVILE', u(opts.mainX ?? -0.3), opts.mainZ ?? 1.02, opts.mainSize ?? 0.2, NAVY, 'center', 900, opts.mainW ?? 2.6);
  if (top) faceText(ctx, top, u(opts.topX ?? -0.5), opts.topZ ?? (M.H - 0.48), opts.topSize ?? 0.1, NAVY, 'center', 800, opts.topW ?? 2.8);
  if (opts.logoX !== undefined) logo(ctx, u(opts.logoX), opts.logoZ ?? 1.0, opts.logoR ?? 0.2);
}

function cabWindow(ctx, X, x0, x1, z0, z1, slope = 0.55) {
  glass(ctx, [[X(x0), z0], [X(x1), z0], [X(x1 - slope), z1], [X(x0), z1]]);
}

function frontFace(ctx, f, M, h) {
  // u : largeur, v : hauteur depuis le bas de caisse
  const W = M.W;
  rect(ctx, -W / 2, 0, W, 0.2, '#1f2937');                         // pare-chocs
  chevrons(ctx, -W / 2 + 0.06, 0.04, W - 0.12, 0.12);               // chevrons pare-chocs
  rect(ctx, -0.55, 0.26, 1.1, Math.min(0.3, h - 0.3), '#111827');   // calandre
  logo(ctx, 0, 0.26 + Math.min(0.3, h - 0.3) / 2, 0.08);
  rect(ctx, -W / 2 + 0.08, h - 0.2, 0.34, 0.12, '#e5e7eb');          // phares
  rect(ctx, W / 2 - 0.42, h - 0.2, 0.34, 0.12, '#e5e7eb');
  rect(ctx, -W / 2 + 0.08, h - 0.22, 0.34, 0.03, '#60a5fa');
  rect(ctx, W / 2 - 0.42, h - 0.22, 0.34, 0.03, '#60a5fa');
  rect(ctx, -W / 2 + 0.1, 0.24, 0.16, 0.06, '#3b82f6');             // feux bleus de calandre
  rect(ctx, W / 2 - 0.26, 0.24, 0.16, 0.06, '#3b82f6');
}

function hoodFace(ctx, f, M) {
  chevrons(ctx, -M.W / 2, 0, M.W, Math.min(0.22, f.len * 0.5));
}

function windshieldFace(ctx, f, M) {
  glass(ctx, [[-M.W / 2 + 0.08, 0.06], [M.W / 2 - 0.08, 0.06], [M.W / 2 - 0.12, f.len - 0.06], [-M.W / 2 + 0.12, f.len - 0.06]]);
  rect(ctx, -0.5, f.len - 0.18, 1.0, 0.1, '#0b1220');
  faceText(ctx, 'PREMIERS SECOURS', 0, f.len - 0.13, 0.07, '#e5e7eb', 'center', 800, 0.95);
}

function rearFace(ctx, f, M, opts = {}) {
  const W = M.W, h = f.len;
  rect(ctx, -0.008, 0.05, 0.016, h - 0.1, '#475569');               // séparation des portes
  if (!opts.noWindows) {
    glass(ctx, [[-W / 2 + 0.12, h - 0.75], [-0.06, h - 0.75], [-0.06, h - 0.22], [-W / 2 + 0.12, h - 0.22]], false);
    glass(ctx, [[0.06, h - 0.75], [W / 2 - 0.12, h - 0.75], [W / 2 - 0.12, h - 0.22], [0.06, h - 0.22]], false);
  }
  chevrons(ctx, -W / 2 + 0.06, 0.18, W - 0.12, opts.chevH ?? 0.55);
  rect(ctx, -W / 2 + 0.02, 0.1, 0.1, h * 0.55, RED);                // feux arrière
  rect(ctx, W / 2 - 0.12, 0.1, 0.1, h * 0.55, RED);
  rect(ctx, -W / 2, -0.02, W, 0.12, '#1f2937');
  if (opts.label) faceText(ctx, opts.label, 0, (opts.labelZ ?? h - 0.95), 0.09, NAVY, 'center', 900, W - 0.3);
}

function roofFace(ctx, f, M) {
  // trappe de toit
  rect(ctx, -0.35, f.len * 0.45, 0.7, 0.5, '#e2e8f0');
}

// ---------- Modèles ----------
function vanModel(cfg) {
  const L = cfg.L ?? 5.5, W = cfg.W ?? 2.05, H = cfg.H ?? 2.48, zb = 0.36;
  const M = { L, W, H, zb, r: 0.36, axles: [L / 2 - 0.95, -L / 2 + 1.2] };
  const prof = [[-L / 2, zb], [L / 2, zb], [L / 2, 0.95], [L / 2 - 0.55, 1.18], [L / 2 - 1.42, H - 0.06], [L / 2 - 1.7, H], [-L / 2, H]];
  const tags = ['skip', 'front', 'hood', 'windshield', 'skip', 'roof', 'rear'];
  const pr = prism(prof, W, tags);
  const deco = {
    side: (ctx, f, X) => {
      sideLivery(ctx, f, X, M, { yellowZ: H - 0.32, yellowEnd: L / 2 - 1.75, swooshTop: 1.3 });
      cabWindow(ctx, X, L / 2 - 2.3, L / 2 - 0.62, 1.3, H - 0.26, 0.82);
      // portes
      ctx.strokeStyle = '#64748b'; ctx.lineWidth = 0.018;
      [L / 2 - 2.35, L / 2 - 0.6].forEach(x => { ctx.beginPath(); ctx.moveTo(X(x), zb + 0.1); ctx.lineTo(X(x), H - 0.2); ctx.stroke(); });
      if (cfg.sideWindows) cfg.sideWindows(ctx, X, M);
      sideTexts(ctx, X, M, true, cfg.topText, { mainX: cfg.mainX ?? -0.55, logoX: L / 2 - 1.45, logoZ: 0.98, logoR: 0.17, topX: cfg.topX ?? -0.7 });
      // rétro-poignée
      rect(ctx, Math.min(X(L / 2 - 2.2), X(L / 2 - 2.05)), 1.1, 0.15, 0.04, '#334155');
    },
    front: (ctx, f) => frontFace(ctx, f, M, f.len),
    hood: (ctx, f) => hoodFace(ctx, f, M),
    windshield: (ctx, f) => windshieldFace(ctx, f, M),
    rear: (ctx, f) => rearFace(ctx, f, M, { noWindows: cfg.rearNoWindows, label: cfg.rearLabel }),
    roof: (ctx, f) => roofFace(ctx, f, M)
  };
  return {
    M,
    parts: [{ type: 'prism', pr, deco, cx: 0 }],
    lightbar: { x0: L / 2 - 2.05, x1: L / 2 - 1.75, z: H, w: 1.5 },
    rearLights: { x: -L / 2 + 0.08, z: H },
    mirrors: [L / 2 - 0.62, 1.25]
  };
}

function truckModel(cfg) {
  const L = cfg.L ?? 7.2, W = cfg.W ?? 2.4, Hc = 2.85, Hb = cfg.Hb ?? 3.45, zb = 0.6;
  const M = { L, W, H: Hb, zb, r: 0.5, axles: [L / 2 - 1.05, -L / 2 + 1.9] };
  const cabL = 1.95, xc0 = L / 2 - cabL;
  const cab = prism([[xc0, zb], [L / 2, zb], [L / 2, 1.45], [L / 2 - 0.18, Hc - 0.12], [L / 2 - 0.35, Hc], [xc0, Hc]], W, ['skip', 'front', 'windshield', 'skip', 'roof', 'skip']);
  const boxL = L - cabL - 0.15;
  const bx1 = xc0 - 0.12, bx0 = -L / 2;
  const boxP = prism([[bx0, 1.0], [bx1, 1.0], [bx1, Hb], [bx0, Hb]], W, ['skip', 'boxfront', 'roof', 'rear']);
  const Mc = { ...M, W };
  const cabDeco = {
    side: (ctx, f, X) => {
      rect(ctx, -10, zb - 0.02, 20, 0.12, '#374151');
      chevrons(ctx, Math.min(X(xc0), X(L / 2)), zb + 0.12, cabL, 0.14);
      glass(ctx, [[X(xc0 + 0.35), 1.65], [X(L / 2 - 0.2), 1.65], [X(L / 2 - 0.3), Hc - 0.25], [X(xc0 + 0.35), Hc - 0.25]]);
      logo(ctx, X(xc0 + 0.95), 1.18, 0.2);
      rect(ctx, -10, Hc - 0.12, 20, 0.04, YELLOW);
      ctx.fillStyle = '#1f2937'; ctx.beginPath(); ctx.arc(X(M.axles[0]), 0, M.r + 0.08, 0, Math.PI); ctx.fill();
    },
    front: (ctx, f) => {
      const h = f.len;
      rect(ctx, -W / 2, 0, W, 0.28, '#1f2937');
      chevrons(ctx, -W / 2 + 0.06, 0.05, W - 0.12, 0.16);
      rect(ctx, -0.6, 0.38, 1.2, 0.36, '#111827');
      faceText(ctx, 'PROTECTION CIVILE', 0, 0.56, 0.1, '#ffffff', 'center', 900, 1.1);
      rect(ctx, -W / 2 + 0.06, 0.34, 0.32, 0.16, '#e5e7eb'); rect(ctx, W / 2 - 0.38, 0.34, 0.32, 0.16, '#e5e7eb');
      rect(ctx, -W / 2, h - 0.08, W, 0.08, '#e5e7eb');
    },
    windshield: (ctx, f) => {
      glass(ctx, [[-W / 2 + 0.1, 0.05], [W / 2 - 0.1, 0.05], [W / 2 - 0.1, f.len - 0.08], [-W / 2 + 0.1, f.len - 0.08]]);
    },
    roof: () => {}
  };
  const boxDeco = {
    side: (ctx, f, X) => {
      sideLivery(ctx, f, X, { ...M, L: boxL * 2, zb: 1.0, axles: [] }, { checkZ: 1.06, checkEnd: bx1 - 0.05, swooshFrom: bx0, swooshTo: bx0 + 2.4, swooshTop: 2.2, yellowZ: Hb - 0.18, yellowEnd: bx1 });
      if (cfg.boxWindows) cfg.boxWindows(ctx, X, M, bx0, bx1);
      faceText(ctx, 'PROTECTION CIVILE', X((bx0 + bx1) / 2 + 0.4), 1.95, 0.27, NAVY, 'center', 900, boxL - 1.2);
      if (cfg.topText) faceText(ctx, cfg.topText, X((bx0 + bx1) / 2 + 0.4), Hb - 0.48, 0.15, NAVY, 'center', 900, boxL - 1.4);
      logo(ctx, X(bx1 - 0.55), 2.6, 0.3);
      ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 0.02;
      ctx.strokeRect(Math.min(X(bx0 + 0.05), X(bx1 - 0.05)), 1.03, Math.abs(X(bx1 - 0.05) - X(bx0 + 0.05)), Hb - 1.08);
    },
    rear: (ctx, f) => {
      const h = f.len;
      if (cfg.shutter) { ctx.fillStyle = '#e2e8f0'; ctx.fillRect(-W / 2 + 0.1, 0.1, W - 0.2, h - 0.25); ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 0.015; for (let z = 0.2; z < h - 0.2; z += 0.12) { ctx.beginPath(); ctx.moveTo(-W / 2 + 0.1, z); ctx.lineTo(W / 2 - 0.1, z); ctx.stroke(); } }
      else rect(ctx, -0.008, 0.05, 0.016, h - 0.1, '#475569');
      chevrons(ctx, -W / 2 + 0.06, 0.02, W - 0.12, 0.3);
      rect(ctx, -W / 2 + 0.02, 0.05, 0.1, 0.5, RED); rect(ctx, W / 2 - 0.12, 0.05, 0.1, 0.5, RED);
      logo(ctx, 0, h - 0.5, 0.25);
    },
    boxfront: () => {},
    roof: () => {}
  };
  const chassis = { x0: -L / 2 + 0.3, x1: L / 2 - 0.3, y: W / 2 - 0.3, z0: zb - 0.05, z1: 1.0 };
  return {
    M,
    parts: [
      { type: 'chassis', ...chassis, cx: 0 },
      { type: 'prism', pr: boxP, deco: boxDeco, cx: (bx0 + bx1) / 2 },
      { type: 'prism', pr: cab, deco: cabDeco, cx: (xc0 + L / 2) / 2 }
    ],
    lightbar: { x0: L / 2 - 0.75, x1: L / 2 - 0.5, z: Hc, w: 1.6 },
    rearLights: { x: bx0 + 0.08, z: Hb },
    mirrors: [L / 2 - 0.05, 1.9],
    dualRear: true,
    extra: cfg.mast
  };
}

function carModel(cfg) {
  const L = 4.05, W = 1.74, H = 1.46, zb = 0.3;
  const M = { L, W, H, zb, r: 0.31, axles: [L / 2 - 0.8, -L / 2 + 0.78] };
  const prof = [[-L / 2, zb], [L / 2, zb], [L / 2, 0.72], [L / 2 - 0.95, 0.9], [L / 2 - 1.62, H - 0.03], [-L / 2 + 0.55, H], [-L / 2 + 0.05, 1.0], [-L / 2, 0.98]];
  const tags = ['skip', 'front', 'hood', 'windshield', 'roof', 'hatch', 'skip', 'rear'];
  const pr = prism(prof, W, tags);
  const deco = {
    side: (ctx, f, X) => {
      rect(ctx, -10, zb - 0.02, 20, 0.08, '#374151');
      // vitres
      glass(ctx, [[X(-L / 2 + 0.45), 0.98], [X(L / 2 - 1.0), 0.98], [X(L / 2 - 1.55), H - 0.08], [X(-L / 2 + 0.62), H - 0.08]]);
      ctx.fillStyle = '#f8fafc'; const px = X(-0.15); rect(ctx, px - 0.05, 0.95, 0.1, H - 0.95, '#f8fafc');
      // bandes
      ctx.save();
      const a = X(-L / 2), b = X(L / 2 - 0.3);
      for (let x = -L / 2 + 0.05, i = 0; x < L / 2 - 0.3; x += 0.14, i++) { const u0 = X(x), u1 = X(x + 0.14); rect(ctx, Math.min(u0, u1), 0.42, Math.abs(u1 - u0), 0.14, i % 2 ? NAVY : ORANGE); }
      void a; void b;
      rect(ctx, Math.min(X(-L / 2), X(L / 2)), 0.6, L, 0.05, ORANGE);
      ctx.restore();
      faceText(ctx, 'PROTECTION CIVILE', X(0.1), 0.78, 0.13, NAVY, 'center', 900, 2.2);
      logo(ctx, X(L / 2 - 0.55), 0.78, 0.11);
      M.axles.forEach(ax => { ctx.fillStyle = '#1f2937'; ctx.beginPath(); ctx.arc(X(ax), 0, M.r + 0.06, 0, Math.PI); ctx.fill(); });
      ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 0.015; [-0.15, L / 2 - 1.0].forEach(x => { ctx.beginPath(); ctx.moveTo(X(x), zb + 0.08); ctx.lineTo(X(x), 0.98); ctx.stroke(); });
    },
    front: (ctx, f) => {
      rect(ctx, -W / 2, 0, W, 0.15, '#1f2937');
      chevrons(ctx, -W / 2 + 0.05, 0.03, W - 0.1, 0.09);
      rect(ctx, -0.4, 0.18, 0.8, 0.16, '#111827');
      rect(ctx, -W / 2 + 0.06, f.len - 0.15, 0.32, 0.1, '#e5e7eb'); rect(ctx, W / 2 - 0.38, f.len - 0.15, 0.32, 0.1, '#e5e7eb');
    },
    hood: (ctx, f) => { chevrons(ctx, -W / 2, 0, W, 0.12); },
    windshield: (ctx, f) => glass(ctx, [[-W / 2 + 0.1, 0.05], [W / 2 - 0.1, 0.05], [W / 2 - 0.15, f.len - 0.05], [-W / 2 + 0.15, f.len - 0.05]]),
    hatch: (ctx, f) => { glass(ctx, [[-W / 2 + 0.15, 0.1], [W / 2 - 0.15, 0.1], [W / 2 - 0.18, f.len - 0.06], [-W / 2 + 0.18, f.len - 0.06]], false); },
    rear: (ctx, f) => {
      chevrons(ctx, -W / 2 + 0.05, 0.12, W - 0.1, f.len - 0.25);
      rect(ctx, -W / 2 + 0.02, f.len - 0.25, 0.2, 0.15, RED); rect(ctx, W / 2 - 0.22, f.len - 0.25, 0.2, 0.15, RED);
      rect(ctx, -W / 2, -0.02, W, 0.1, '#1f2937');
    },
    roof: () => {}
  };
  return { M, parts: [{ type: 'prism', pr, deco, cx: 0 }], lightbar: { x0: -0.35, x1: -0.1, z: H, w: 1.1 }, mirrors: [L / 2 - 1.05, 0.95] };
}

const vpspWindows = (ctx, X, M) => {
  // vitre dépolie arrière + porte latérale coulissante
  glass(ctx, [[X(-0.55), 1.35], [X(0.6), 1.35], [X(0.6), M.H - 0.62], [X(-0.55), M.H - 0.62]], false);
  ctx.fillStyle = 'rgba(255,255,255,0.55)'; ctx.fillRect(Math.min(X(-0.55), X(0.6)), 1.35, 1.15, 0.5);
};
const vtpWindows = (ctx, X, M) => {
  [[-2.45, -1.5], [-1.38, -0.42], [-0.3, 0.62]].forEach(([a, b]) => glass(ctx, [[X(a), 1.32], [X(b), 1.32], [X(b), M.H - 0.42], [X(a), M.H - 0.42]]));
};
const pcWindows = (ctx, X, M, bx0, bx1) => {
  [bx0 + 0.6, bx0 + 2.0].forEach(a => glass(ctx, [[X(a), 2.35], [X(a + 0.8), 2.35], [X(a + 0.8), 2.95], [X(a), 2.95]]));
};

const MODELS = {
  vpsp: () => vanModel({ topText: 'VÉHICULE DE PREMIERS SECOURS À PERSONNES', sideWindows: vpspWindows, mainX: -0.9, rearLabel: 'PREMIERS SECOURS' }),
  vtu_pop: () => vanModel({ topText: 'SOUTIEN AUX POPULATIONS', rearNoWindows: true }),
  vtu_log: () => vanModel({ topText: 'LOGISTIQUE', rearNoWindows: true }),
  vtp: () => vanModel({ topText: 'TRANSPORT DE PERSONNES', sideWindows: vtpWindows, H: 2.42, mainX: -0.9 }),
  vl: () => carModel({}),
  pc: () => truckModel({ topText: 'POSTE DE COMMANDEMENT', boxWindows: pcWindows }),
  pl_pop: () => truckModel({ topText: 'SOUTIEN AUX POPULATIONS', shutter: true })
};

const DIRS = { se: 0, sw: Math.PI / 2, nw: Math.PI, ne: -Math.PI / 2 };

function render(key, dir) {
  const mdl = MODELS[key]();
  const M = mdl.M;
  const cam = makeCam(DIRS[dir]);
  // Bornes écran
  const pts = [];
  for (const x of [-M.L / 2 - 0.3, M.L / 2 + 0.3]) for (const y of [-M.W / 2 - 0.3, M.W / 2 + 0.3]) for (const z of [0, M.H + 0.35]) pts.push(cam.proj([x, y, z]));
  const minX = Math.min(...pts.map(p => p[0])), maxX = Math.max(...pts.map(p => p[0]));
  const minY = Math.min(...pts.map(p => p[1])), maxY = Math.max(...pts.map(p => p[1]));
  const cw = Math.ceil(maxX - minX) + 8, ch = Math.ceil(maxY - minY) + 8;
  const ox = -minX + 4, oy = -minY + 4;
  const cv = document.createElement('canvas'); cv.width = cw; cv.height = ch;
  const ctx = cv.getContext('2d');
  ctx.lineJoin = 'round';

  const sideVisible = visible(cam, [0, 1, 0]) ? 1 : -1;   // flanc visible (y local)
  const wy = M.W / 2 - 0.12;
  const wheelsAt = (side) => M.axles.forEach((ax, i) => {
    const r = M.r;
    drawWheel(ctx, cam, ax, side * (wy + (mdl.dualRear && i === 1 ? 0.04 : 0)), r, ox, oy, side, mdl.dualRear && i === 1 ? 0.42 : 0.24);
  });
  // Ombre douce au sol
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  faceTransform(ctx, cam, [0, 0, 0], [1, 0, 0], [0, 1, 0], ox, oy);
  ctx.fillStyle = 'rgba(15,23,42,0.18)';
  ctx.beginPath(); ctx.rect(-M.L / 2 - 0.05, -M.W / 2 - 0.05, M.L + 0.25, M.W + 0.25); ctx.fill();

  // Roues côté caché, rétroviseur caché
  wheelsAt(-sideVisible);
  if (mdl.mirrors) drawBox(ctx, cam, mdl.mirrors[0] - 0.12, mdl.mirrors[0], -sideVisible * (M.W / 2 + 0.22) - 0.04, -sideVisible * (M.W / 2 + 0.22) + 0.04, mdl.mirrors[1], mdl.mirrors[1] + 0.32, { top: '#1f2937', side: '#111827' }, ox, oy);

  // Parties (tri arrière -> avant selon le cap)
  const parts = mdl.parts.slice().sort((a, b) => {
    const wa = cam.toWorld([a.cx, 0, 0]), wb = cam.toWorld([b.cx, 0, 0]);
    return (wa[0] + wa[1]) - (wb[0] + wb[1]);
  });
  // le châssis toujours en premier
  parts.sort((a, b) => (a.type === 'chassis' ? -1 : 0) - (b.type === 'chassis' ? -1 : 0));
  parts.forEach(p => {
    if (p.type === 'chassis') drawBox(ctx, cam, p.x0, p.x1, -p.y, p.y, p.z0, p.z1, { top: '#374151', side: '#1f2937' }, ox, oy);
    else drawPrism(ctx, cam, p.pr, p.deco, ox, oy);
  });

  // Rampe de gyrophares bleus
  const lb = mdl.lightbar;
  const lights = [];
  if (lb) {
    drawBox(ctx, cam, lb.x0, lb.x1, -lb.w / 2, lb.w / 2, lb.z, lb.z + 0.05, { top: '#334155', side: '#1f2937' }, ox, oy);
    drawBox(ctx, cam, lb.x0 + 0.02, lb.x1 - 0.02, -lb.w / 2 + 0.02, -0.06, lb.z + 0.05, lb.z + 0.17, { top: '#60a5fa', side: '#2563eb' }, ox, oy);
    drawBox(ctx, cam, lb.x0 + 0.02, lb.x1 - 0.02, 0.06, lb.w / 2 - 0.02, lb.z + 0.05, lb.z + 0.17, { top: '#60a5fa', side: '#2563eb' }, ox, oy);
    [-lb.w / 4, lb.w / 4].forEach(y => { const p = cam.proj([(lb.x0 + lb.x1) / 2, y, lb.z + 0.12]); lights.push([Math.round(p[0] + ox), Math.round(p[1] + oy)]); });
  }
  if (mdl.rearLights) {
    const rl = mdl.rearLights;
    [-M.W / 2 + 0.12, M.W / 2 - 0.22].forEach(y => drawBox(ctx, cam, rl.x - 0.06, rl.x + 0.06, y, y + 0.1, rl.z, rl.z + 0.09, { top: '#60a5fa', side: '#2563eb' }, ox, oy));
  }
  if (mdl.extra === 'mast') {}

  // Roues côté visible, rétroviseur visible
  wheelsAt(sideVisible);
  if (mdl.mirrors) drawBox(ctx, cam, mdl.mirrors[0] - 0.12, mdl.mirrors[0], sideVisible * (M.W / 2 + 0.22) - 0.04, sideVisible * (M.W / 2 + 0.22) + 0.04, mdl.mirrors[1], mdl.mirrors[1] + 0.32, { top: '#1f2937', side: '#111827' }, ox, oy);

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  return { url: cv.toDataURL('image/png'), meta: { file: `${key}_${dir}.png`, ax: Math.round(ox), ay: Math.round(oy), k: K, L: M.L, W: M.W, H: M.H, lights, w: cw, h: ch } };
}

window.renderAll = function () {
  const out = {};
  const files = {};
  Object.keys(MODELS).forEach(key => {
    out[key] = {};
    Object.keys(DIRS).forEach(dir => {
      const r = render(key, dir);
      out[key][dir] = r.meta;
      files[r.meta.file] = r.url;
    });
  });
  return { manifest: { version: 1, hz: HZ, k: K, models: out }, files };
};
</script>
</body></html>
