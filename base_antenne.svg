<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 80" width="100%" height="100%">
  <!-- Roof in perspective -->
  <polygon points="12,27 38,20 88,27 62,16" fill="#1e293b" stroke="#0f172a" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Left Wall (White facade with dark outline) -->
  <polygon points="12,27 38,20 38,68 12,59" fill="#ffffff" stroke="#0f172a" stroke-width="3.5" stroke-linejoin="round"/>
  <!-- Right Wall (Dark hangar side) -->
  <polygon points="38,20 88,27 88,61 38,68" fill="#0f172a" stroke="#0f172a" stroke-width="3.5" stroke-linejoin="round"/>
  <!-- Left Wall Upper Windows -->
  <rect x="17" y="32" width="4.5" height="7" fill="#0f172a" rx="0.5"/>
  <rect x="24" y="30.5" width="4.5" height="7" fill="#0f172a" rx="0.5"/>
  <rect x="31" y="29" width="4.5" height="7" fill="#0f172a" rx="0.5"/>
  <!-- Left Wall Entrance Door -->
  <rect x="17" y="47" width="7" height="11.5" fill="#0f172a" rx="0.5"/>
  <!-- Garage Bay 1 -->
  <polygon points="43,41 54,42.5 54,65 43,66.5" fill="#ffffff" stroke="#0f172a" stroke-width="1.2"/>
  <rect x="45" y="45.5" width="2" height="2" fill="#0f172a"/>
  <rect x="49" y="46" width="2" height="2" fill="#0f172a"/>
  <!-- Garage Bay 2 -->
  <polygon points="58,43 69,44.5 69,62.5 58,64" fill="#ffffff" stroke="#0f172a" stroke-width="1.2"/>
  <rect x="60" y="47" width="2" height="2" fill="#0f172a"/>
  <rect x="64" y="47.5" width="2" height="2" fill="#0f172a"/>
  <!-- Garage Bay 3 -->
  <polygon points="73,45 84,46.5 84,60 73,61.5" fill="#ffffff" stroke="#0f172a" stroke-width="1.2"/>
  <rect x="75" y="48.5" width="2" height="2" fill="#0f172a"/>
  <rect x="79" y="49" width="2" height="2" fill="#0f172a"/>
</svg>
